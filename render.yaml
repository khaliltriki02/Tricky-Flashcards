services:
  - type: web
    name: tricky-flashcards
    runtime: node
    region: frankfurt
    plan: free
    # Free-tier web services do not support preDeployCommand. Run the schema
    # sync at the end of the build instead, before the new service starts.
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm --filter @workspace/tricky-flashcards build && pnpm --filter @workspace/api-server build && pnpm --filter @workspace/db push
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Set this secret to the Neon pooled connection string in Render's
      # dashboard. Do not commit the value to this repository.
      - key: DATABASE_URL
        sync: false
